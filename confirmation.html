<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Confirmation page for Ian Santiago's COP4813 contact form.">
    <meta name="author" content="Ian Santiago">

    <title>Confirm Information - Ian Santiago</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Confirm Your Information</h1>
        <p>COP4813 Web Systems I</p>
    </header>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="assignments.html">My Assignments</a>
        <a href="form.html">Contact Form</a>
    </nav>

    <main>
        <section>
            <h2>Review Your Information</h2>

            <p>
                Please review the information below before confirming.
            </p>

            <div id="confirmationData"></div>

            <button type="button" id="confirmButton">
                Confirm Information
            </button>

            <p>
                <a href="form.html">Go Back and Edit</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Created by Ian Santiago</p>
    </footer>

    <script>
        const confirmationData = document.getElementById("confirmationData");

        confirmationData.innerHTML = `
            <p><strong>First Name:</strong> ${sessionStorage.getItem("firstName")}</p>
            <p><strong>Last Name:</strong> ${sessionStorage.getItem("lastName")}</p>
            <p><strong>Email:</strong> ${sessionStorage.getItem("email")}</p>
            <p><strong>Phone:</strong> ${sessionStorage.getItem("phone")}</p>
            <p><strong>Birth Date:</strong> ${sessionStorage.getItem("birthdate")}</p>
            <p><strong>Address:</strong> ${sessionStorage.getItem("address")}</p>
            <p><strong>City:</strong> ${sessionStorage.getItem("city")}</p>
            <p><strong>State:</strong> ${sessionStorage.getItem("state")}</p>
            <p><strong>ZIP Code:</strong> ${sessionStorage.getItem("zip")}</p>
            <p><strong>Message:</strong> ${sessionStorage.getItem("message")}</p>
        `;

        document.getElementById("confirmButton").addEventListener("click", function() {
            const firstName = sessionStorage.getItem("firstName");
            const lastName = sessionStorage.getItem("lastName");
            const email = sessionStorage.getItem("email");
            const phone = sessionStorage.getItem("phone");
            const birthdate = sessionStorage.getItem("birthdate");
            const address = sessionStorage.getItem("address");
            const city = sessionStorage.getItem("city");
            const state = sessionStorage.getItem("state");
            const zip = sessionStorage.getItem("zip");
            const message = sessionStorage.getItem("message");

            const subject = "COP4813 Contact Form Submission";

            const body =
                "First Name: " + firstName + "\n" +
                "Last Name: " + lastName + "\n" +
                "Email: " + email + "\n" +
                "Phone: " + phone + "\n" +
                "Birth Date: " + birthdate + "\n" +
                "Address: " + address + "\n" +
                "City: " + city + "\n" +
                "State: " + state + "\n" +
                "ZIP Code: " + zip + "\n\n" +
                "Message:\n" + message;

            window.location.href =
                "mailto:ianstarfish13@gmail.com?subject=" +
                encodeURIComponent(subject) +
                "&body=" +
                encodeURIComponent(body);
        });
        });
    </script>

</body>
</html>
