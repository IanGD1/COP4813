<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Assignment 3 HTML5 form for COP4813.">
    <meta name="author" content="Ian Santiago">

    <title>Assignment 3 - Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Assignment 3 - Form</h1>
        <p>COP4813 Web Systems I</p>
    </header>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="assignments.html">My Assignments</a>
    </nav>

    <main>
        <section>
            <h2>Contact Information</h2>

            <p>
                Please enter the requested information below.
            </p>

            <form id="contactForm">

                <h3>Personal Information</h3>

                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" required>

                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" required>

                <h3>Address</h3>

                <label for="address">Street Address:</label>
                <input type="text" id="address" name="address" required>

                <label for="city">City:</label>
                <input type="text" id="city" name="city" required>

                <label for="state">State:</label>
                <input type="text" id="state" name="state" required>

                <label for="zip">ZIP Code:</label>
                <input type="text" id="zip" name="zip" required>

                <h3>Contact Information</h3>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="(000)000-0000" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="birthdate">Birth Date:</label>
                <input type="date" id="birthdate" name="birthdate" required>

                <h3>Message</h3>

                <label for="message">Message:</label>
                <textarea id="message" name="message"
                          rows="6" required></textarea>

                <h3>Confirmation</h3>

                <label for="securityAnswer">
                    What is 5 + 3?
                </label>

                <input type="text" id="securityAnswer"
                       name="securityAnswer" required>

                <button type="submit">Submit</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Created by Ian Santiago</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
